<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- No height=device-height: on Android Chrome it fights the collapsing address bar; the canvas is fixed to the viewport instead. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!--
    Orientation rule: the game supports portrait and landscape and must follow the device as the user holds it.
    Never call screen.orientation.lock(), never force fullscreen, never show a blocking "rotate your device" screen:
    a user's OS rotation lock must always win. The game adapts its camera and HUD to any aspect at runtime.
  -->
  <title>BlockRush Racing</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #5b9be6; }
    body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; background: #5b9be6; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              font: bold 7vmin/1.1 "Arial Black", Arial, sans-serif; color: #ffd640; text-shadow: 0.4vmin 0.4vmin 0 #000; }
    #loader small { font-size: 3vmin; color: #fff; letter-spacing: 1.2vmin; margin-bottom: 4vmin; }
    #bar { width: 60vmin; height: 3vmin; background: rgba(0,0,0,.45); border: 0.5vmin solid #000; }
    #fill { width: 0; height: 100%; background: #72d955; }
    #error { display: none; position: fixed; left: 0; right: 0; bottom: 6vmin; text-align: center; color: #fff; font: 3vmin Arial, sans-serif; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">BLOCKRUSH<small>RACING</small><div id="bar"><div id="fill"></div></div></div>
  <div id="error"></div>
  <script>
    var canvas = document.getElementById("unity-canvas");
    var isMobile = /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
    // Phones report DPR 2-3; rendering at full DPR costs 4-9x the pixels. Cap it (the game adds dynamic resolution on top).
    var dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2);
    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

    var config = {
      dataUrl: "Build/WebGL.data.unityweb",
      frameworkUrl: "Build/WebGL.framework.js.unityweb",
      codeUrl: "Build/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Zio",
      productName: "BlockRush Racing",
      productVersion: "0.1.0-alpha.1",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: dpr,
      showBanner: function (msg, type) {
        if (type === "error") { var e = document.getElementById("error"); e.style.display = "block"; e.textContent = msg; }
        console.log(msg);
      }
    };

    var script = document.createElement("script");
    script.src = "Build/WebGL.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        document.getElementById("fill").style.width = (100 * p) + "%";
      }).then(function (instance) {
        document.getElementById("loader").style.display = "none";
        window.unityInstance = instance;
      }).catch(function (message) {
        var e = document.getElementById("error"); e.style.display = "block"; e.textContent = message;
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
